name: Build TapScript

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test and build
        run: gradle test :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/build-tools/lib
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/TapScript-v0.1.0-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" dist/build-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" dist/build-tools/lib/

      - uses: actions/upload-artifact@v4
        with:
          name: TapScript-v0.1.0-unsigned-build
          path: dist/
          if-no-files-found: error
          retention-days: 30
