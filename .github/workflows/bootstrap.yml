name: Bootstrap TapScript

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .bootstrap-extracted
          cat bootstrap/part-* | base64 --decode | tar -xJ -C .bootstrap-extracted
          cp -a .bootstrap-extracted/TapScript/. .
          rm -rf bootstrap .bootstrap-extracted
          rm -f .github/workflows/android.yml

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bootstrap TapScript source"
          git push origin HEAD:master

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Test and build
        run: gradle test :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Collect build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/build-tools/lib
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/TapScript-v0.1.0-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" dist/build-tools/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" dist/build-tools/lib/

      - uses: actions/upload-artifact@v4
        with:
          name: TapScript-v0.1.0-unsigned-build
          path: dist/
          if-no-files-found: error
          retention-days: 30
